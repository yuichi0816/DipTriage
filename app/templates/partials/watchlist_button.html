<div id="watchlist-button-container" class="mt-3">
  {% if entry and entry.status == "watching" %}
  <button
    hx-post="/watchlist/{{ entry.id }}/close"
    hx-target="#watchlist-button-container"
    hx-swap="outerHTML"
    class="px-4 py-2 bg-green-700 hover:bg-green-800 text-white text-sm rounded-lg"
  >ウォッチ中 ✓</button>
  {% else %}
  <button
    hx-post="/dip/{{ dip_id }}/watchlist"
    hx-target="#watchlist-button-container"
    hx-swap="outerHTML"
    class="px-4 py-2 bg-gray-700 hover:bg-gray-600 text-white text-sm rounded-lg"
  >ウォッチリストに追加</button>
  {% endif %}
</div>
