<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}DipTriage{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/htmx.org@2.0.4"></script>
  <style>.htmx-indicator { display: none; } .htmx-indicator.htmx-request { display: inline; }</style>
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen">
  <header class="bg-gray-900 border-b border-gray-800 px-4 py-3 flex items-center gap-3">
    <a href="/" class="text-lg font-bold text-white tracking-tight">DipTriage</a>
    <span class="hidden sm:inline text-xs text-gray-500">急落ブリーフィング</span>
    <div class="ml-auto flex gap-3 sm:gap-4 text-sm text-gray-400">
      <a href="/" class="hover:text-white">ホーム</a>
      <a href="/watchlist" class="hover:text-white">ウォッチリスト</a>
      <a href="/settings" class="hover:text-white">設定</a>
    </div>
  </header>

  <main class="px-4 py-6 max-w-7xl mx-auto">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
